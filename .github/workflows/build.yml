name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # F8：构建任务仅需读权限；产物经 artifact 传递给 release 任务。
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 11
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'

      - name: Publish (win-x64 self-contained)
        # F9：版本注入——非 tag 构建默认硬编码 1.4.1（与 csproj 的 1.4.1 一致，见残余清单；tag 构建时取 tag 名去掉前缀 v 后的版本号）。
        # refs/tags/ 占 10 位、v 占第 11 位（0 起计），故从第 11 位截取即为纯版本号，如 v1.4.1 -> 1.4.1。
        run: |
          $version = "1.4.1"
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF.Substring(11) }
          dotnet publish TiviMateWin.csproj -c Release -r win-x64 --self-contained true -o publish -p:Version=$version

      - name: Verify output
        run: |
          Get-ChildItem publish -Recurse | Select-Object FullName, Length | Select-Object -First 20
          if (-not (Test-Path "publish\TiviMateWin.exe")) { throw "TiviMateWin.exe not found" }

      - name: Run --selftest
        shell: pwsh
        run: |
          $exe = "publish\TiviMateWin.exe"
          $log = Join-Path $env:TEMP "tivimate_selftest.txt"
          if (Test-Path $log) { Remove-Item $log -Force }
          $p = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList "--selftest" -Wait -PassThru
          Write-Host "selftest exit code: $($p.ExitCode)"
          $fail = $false
          if ($p.ExitCode -ne 0) { $fail = $true }
          if (Test-Path $log) {
            Get-Content $log | ForEach-Object { Write-Host $_ }
            if (Select-String -Path $log -Pattern '^FAIL' -Quiet) { $fail = $true }
            if (-not (Select-String -Path $log -Pattern '^DONE' -Quiet)) { $fail = $true }
          } else {
            Write-Host "SELFTEST LOG NOT FOUND: $log"
            $fail = $true
          }
          if ($fail) { exit 1 }

      - name: Package zip
        run: |
          Compress-Archive -Path publish\* -DestinationPath TiviMateWin-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TiviMateWin-win-x64
          path: TiviMateWin-win-x64.zip

  release:
    needs: build
    # F8：仅 tag 时运行并持有 contents:write；PR 检查不执行本任务。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifact
        # 不新增第三方 Action：用 gh CLI 下载本 run 的 build 产物。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.run_id }} --name TiviMateWin-win-x64 --dir artifact
          Get-ChildItem artifact -Recurse | Select-Object FullName, Length

      - name: Release (on tag)
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifact/TiviMateWin-win-x64.zip
          generate_release_notes: true
