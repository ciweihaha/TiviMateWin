name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # 最小权限说明：contents:write 仅用于 tag 触发时的 Release 步骤创建 Release；非 tag 运行不产生写操作。
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (win-x64 self-contained)
        run: |
          dotnet publish TiviMateWin.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Verify output
        run: |
          Get-ChildItem publish -Recurse | Select-Object FullName, Length | Select-Object -First 20
          if (-not (Test-Path "publish\TiviMateWin.exe")) { throw "TiviMateWin.exe not found" }

      - name: Package zip
        run: |
          Compress-Archive -Path publish\* -DestinationPath TiviMateWin-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TiviMateWin-win-x64
          path: TiviMateWin-win-x64.zip

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: TiviMateWin-win-x64.zip
          generate_release_notes: true