name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # F8：构建任务仅需读权限；产物经 artifact 传递给 release 任务。
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (win-x64 self-contained)
        # F9：版本注入——默认用 csproj 的 1.3.3（本地构建回退）；tag 构建时取 tag 名去掉前缀 v 后的版本号。
        # refs/tags/ 占 10 位、v 占第 11 位（0 起计），故从第 11 位截取即为纯版本号，如 v1.3.6 -> 1.3.6。
        run: |
          $version = "1.3.3"
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF.Substring(11) }
          dotnet publish TiviMateWin.csproj -c Release -r win-x64 --self-contained true -o publish -p:Version=$version

      - name: Verify output
        run: |
          Get-ChildItem publish -Recurse | Select-Object FullName, Length | Select-Object -First 20
          if (-not (Test-Path "publish\TiviMateWin.exe")) { throw "TiviMateWin.exe not found" }

      - name: Package zip
        run: |
          Compress-Archive -Path publish\* -DestinationPath TiviMateWin-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TiviMateWin-win-x64
          path: TiviMateWin-win-x64.zip

  release:
    needs: build
    # F8：仅 tag 时运行并持有 contents:write；PR 检查不执行本任务。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download build artifact
        # 不新增第三方 Action：用 gh CLI 下载本 run 的 build 产物。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.run_id }} --name TiviMateWin-win-x64 --dir artifact
          Get-ChildItem artifact -Recurse | Select-Object FullName, Length

      - name: Release (on tag)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifact/TiviMateWin-win-x64.zip
          generate_release_notes: true
